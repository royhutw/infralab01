services:
  mariadb:
    image: mariadb:latest
    volumes:
      - 'mariadb_data:/bitnami/mariadb'
    env_file:
      - mariadb.env
  redmine:
    image: redmine:latest
    ports:
      - '3000:3000'
    volumes:
      - 'redmine_data:/bitnami/redmine'
    depends_on:
      - mariadb
    env_file:
      - redmine.env
volumes:
  mariadb_data:
    driver: local
  redmine_data:
    driver: local
